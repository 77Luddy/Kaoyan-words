<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>考研单词 5500</title>
<style>
:root{
  --bg:#f4f6f2; --card:#ffffff; --ink:#1c2b26; --sub:#6b7f76; --line:#e2e8e0;
  --primary:#1a7f63; --primary-soft:#e6f2ed; --accent:#d98026; --danger:#c0392b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#dfe5dc;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink)}
.shell{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;position:relative}
.hd{padding:18px 18px 10px;display:flex;align-items:baseline;gap:8px}
.hd h1{font-size:19px;margin:0;font-weight:600}
.hd .tag{font-size:11px;color:var(--sub);border:1px solid var(--line);padding:1px 6px;border-radius:8px}
.body{flex:1;padding:0 14px 78px;overflow-y:auto}
.card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(20,40,32,.06)}
.tiny{font-size:12px;color:var(--sub)}
.muted{color:var(--sub)}
.ringwrap{display:flex;align-items:center;gap:16px}
.ring{position:relative;width:104px;height:104px;flex:0 0 auto}
.ring svg{width:104px;height:104px}
.ring .val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .val b{font-size:22px;line-height:1}
.ring .val span{font-size:11px;color:var(--sub);margin-top:2px}
.kv{display:flex;gap:10px;margin-top:10px}
.kv .box{flex:1;background:var(--bg);border-radius:10px;padding:8px 10px}
.kv .box b{display:block;font-size:16px}
.kv .box span{font-size:11px;color:var(--sub)}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font-size:15px;font-weight:600;background:var(--primary);color:#fff;margin-top:10px;cursor:pointer}
.btn.ghost{background:var(--primary-soft);color:var(--primary)}
.btn.accent{background:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.section-title{font-size:13px;color:var(--sub);margin:18px 4px 8px;letter-spacing:.5px}
.tier{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.tier:last-child{border-bottom:0}
.tier .badge{width:26px;height:26px;border-radius:8px;background:var(--primary-soft);color:var(--primary);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.tier .m{flex:1}
.tier .m b{font-size:14px;display:block}
.tier .m span{font-size:11px;color:var(--sub)}
.tier .p{font-size:12px;color:var(--sub);white-space:nowrap}
.tier .bar{height:4px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden}
.tier .bar i{display:block;height:4px;background:var(--primary);border-radius:3px}
/* study */
.study-top{display:flex;align-items:center;gap:10px;padding:14px 4px 6px}
.pill{font-size:11px;color:var(--sub);border:1px solid var(--line);border-radius:10px;padding:2px 8px}
.prog{height:4px;background:var(--line);border-radius:3px;overflow:hidden;margin:8px 0 0}
.prog i{display:block;height:4px;background:var(--accent)}
.wordcard{background:var(--card);border-radius:16px;padding:26px 20px;text-align:center;box-shadow:0 2px 8px rgba(20,40,32,.07);min-height:290px;display:flex;flex-direction:column;justify-content:center}
.wordcard .w{font-size:34px;font-weight:700;letter-spacing:.5px;word-break:break-all}
.wordcard .speaker{display:inline-flex;align-items:center;gap:4px;margin-top:10px;color:var(--primary);font-size:12px;cursor:pointer}
.wordcard .m{font-size:17px;margin-top:16px;color:var(--ink);line-height:1.5}
.wordcard .meta{font-size:11px;color:var(--sub);margin-top:8px}
.wordcard .ex{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);text-align:left;font-size:13px;line-height:1.7;color:#3c4a44}
.wordcard .ex em{display:block;font-style:normal;color:var(--sub);font-size:12px;margin-top:4px}
.fb{display:flex;gap:8px;margin-top:14px}
.fb button{flex:1;border:0;border-radius:12px;padding:14px 0;font-size:14px;font-weight:600;cursor:pointer}
.fb .u{background:#fdecea;color:var(--danger)}
.fb .f{background:#fdf1e0;color:var(--accent)}
.fb .k{background:var(--primary);color:#fff}
.donecard{text-align:center;padding:28px 16px}
.donecard b{font-size:20px;display:block;margin-bottom:8px}
.donecard .nums{display:flex;gap:8px;margin:14px 0}
.donecard .nums div{flex:1;background:var(--bg);border-radius:10px;padding:10px 0}
.donecard .nums b{font-size:18px;margin:0}
/* tabs */
.tabs{display:flex;gap:8px;margin:12px 0}
.tabs button{flex:1;border:0;background:var(--card);color:var(--sub);border-radius:10px;padding:9px 0;font-size:13px;cursor:pointer}
.tabs button.on{background:var(--primary);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{width:calc((100% - 24px) / 4);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 0;text-align:center;font-size:12px;cursor:pointer}
.chip.full{background:var(--primary-soft);border-color:#cfe6dd;color:var(--primary);font-weight:600}
.chip.part{background:#fdf1e0;border-color:#f3ddbe;color:var(--accent)}
.searchbox{display:flex;gap:8px;margin-bottom:10px}
.searchbox input{flex:1;border:1px solid var(--line);border-radius:11px;padding:11px 12px;font-size:14px;outline:0;background:var(--card)}
.res{background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.res b{font-size:15px}
.res p{margin:4px 0 0;font-size:12px;color:var(--sub);line-height:1.5}
.seg{display:flex;gap:8px}
.seg button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:11px 0;font-size:14px;cursor:pointer}
.seg button.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.row{display:flex;align-items:center;justify-content:space-between;padding:14px 2px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .l{font-size:14px}
.row .r{font-size:12px;color:var(--sub)}
.chart{display:flex;align-items:flex-end;gap:10px;height:130px;padding:10px 4px 0}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.chart .col .stack{width:100%;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.chart .col .new{background:var(--primary);border-radius:4px 4px 0 0}
.chart .col .rev{background:var(--accent);border-radius:0}
.chart .col span{font-size:10px;color:var(--sub);margin-top:6px}
.legend{display:flex;gap:14px;font-size:11px;color:var(--sub);margin-top:6px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--card);border-top:1px solid var(--line);display:flex;padding:8px 0 10px}
.tabbar button{flex:1;border:0;background:none;font-size:12px;color:var(--sub);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabbar button.on{color:var(--primary);font-weight:600}
.tabbar .dot{width:6px;height:6px;border-radius:50%;background:var(--line)}
.tabbar button.on .dot{background:var(--primary)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(28,43,38,.9);color:#fff;font-size:13px;padding:9px 16px;border-radius:20px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
</style>
<meta name="theme-color" content="#1a7f63">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="考研单词">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
/* 全面屏适配：底部导航避开 iPhone 小黑条 */
body{overscroll-behavior-y:contain}
.tabbar{padding-bottom:calc(10px + env(safe-area-inset-bottom))}
.body{padding-bottom:calc(78px + env(safe-area-inset-bottom))}
</style>
</head>
<body>
<div class="shell">
  <div class="hd"><h1 id="pageTitle">今日</h1><span class="tag" id="pageTag">本地存储 · 不联网</span></div>
  <div class="body" id="stage"></div>
  <div class="tabbar">
    <button data-nav="today" class="on"><i class="dot"></i>今日</button>
    <button data-nav="library"><i class="dot"></i>词库</button>
    <button data-nav="stats"><i class="dot"></i>统计</button>
    <button data-nav="settings"><i class="dot"></i>设置</button>
  </div>
  <div class="toast" id="toast"></div>
</div>

<script src="data.js"></script>
<script>
/* ============================================================
   数据层 —— 与小程序 miniprogram/data/words.js 同源（preview/data.js）
   words[i] = [单词, 释义, 主题下标, 语料词频, CEFR, 真题次数, 例句, 例句翻译, 例句来源, 其他拼写]
   units[u] = {i, k(级别), g(组号), t(标题), d(说明), w(词下标数组)}
   ============================================================ */
var D = window.VOCAB;
var WORDS = D.words, UNITS = D.units, TIERS = D.tiers, TOPICS = D.topics, TOTAL = D.total;
var CHUNK = D.chunk || 20;

var tierOfWord = {};
UNITS.forEach(function (u) { u.w.forEach(function (i) { tierOfWord[i] = u.k; }); });

function wordObj(i) {
  var a = WORDS[i];
  if (!a) return null;
  var tp = TOPICS[a[2]] || ['其他', 0];
  var tmeta = null;
  for (var k = 0; k < TIERS.length; k++) if (TIERS[k].k === (tierOfWord[i] || '')) tmeta = TIERS[k];
  return { i: i, w: a[0], m: a[1], tn: tp[0], f: a[3], k: a[5], ex: a[6], exT: a[7], exS: a[8], tier: tierOfWord[i] || '', tierName: tmeta ? tmeta.n : '' };
}

/* ============================================================
   日期：本地日序号（从 1970-01-01 起算的「本地零点」天数）
   ============================================================ */
function todayInt() {
  var d = new Date();
  var local = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
  return Math.floor(local / 86400000);
}
function intToDate(n) { return new Date(n * 86400000); }
function recentDays(k) {
  var t = todayInt(), out = [];
  for (var i = k - 1; i >= 0; i--) {
    var d = intToDate(t - i);
    out.push({ int: t - i, label: (d.getMonth() + 1) + '/' + d.getDate(), wd: ['日','一','二','三','四','五','六'][d.getDay()] });
  }
  return out;
}

/* ============================================================
   记忆曲线（与 miniprogram/utils/scheduler.js 同一套规则）
   状态 [s, r, due, last, wrong]  s:0未学 1学习中 2已掌握
   ============================================================ */
var INTERVALS = [1, 2, 4, 7, 15, 30, 60, 120];
var MASTER_R = 6;

function blankState(due) { return [0, 0, due || 0, 0, 0]; }
function normState(st, t) {
  if (!st || typeof st.length !== 'number' || st.length < 5) return blankState(t);
  return [+st[0] || 0, +st[1] || 0, +st[2] || 0, +st[3] || 0, +st[4] || 0];
}
function applyState(prev, fb, t) {
  var st = normState(prev, t), s = st[0], r = st[1], due = st[2], wrong = st[4];
  if (fb === 'unknown') { r = 0; s = 1; due = t + 1; wrong += 1; }
  else if (fb === 'fuzzy') {
    r = Math.max(0, r - 1); s = 1;
    var gap = Math.max(1, Math.round(INTERVALS[Math.min(r, INTERVALS.length - 1)] / 2));
    due = t + gap; wrong += 1;
  } else {
    r = Math.min(r + 1, INTERVALS.length);
    s = r >= MASTER_R ? 2 : 1;
    due = t + INTERVALS[Math.min(r, INTERVALS.length) - 1];
  }
  return [s, r, due, t, wrong];
}
function isDue(st, t) { if (!st) return false; if ((+st[0] || 0) === 0) return false; return (+st[2] || 0) <= t; }

/* ============================================================
   存储层（localStorage，键名 kp_*，与小程序 kw_* 一一对应）
   ============================================================ */
var K_W = 'kp_w', K_SET = 'kp_set', K_DAY = 'kp_day';
function rd(key, dft) {
  try { var v = localStorage.getItem(key); return v ? JSON.parse(v) : dft; } catch (e) { return dft; }
}
function wr(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} }

var states = rd(K_W, {});
var settings = Object.assign({ dailyNew: 20, autoSpeak: false, showExample: true }, rd(K_SET, {}));
var dayMap = rd(K_DAY, {});

function saveStates() { wr(K_W, states); }
function saveSettings() { wr(K_SET, settings); }
function saveDay() { wr(K_DAY, dayMap); }

function getState(i) { return states[i] || null; }
function setState(i, st) { states[i] = st; saveStates(); }

function touchDay(kind) {
  var key = String(todayInt());
  if (!dayMap[key]) dayMap[key] = [0, 0];
  if (kind === 'new') dayMap[key][0] += 1; else dayMap[key][1] += 1;
  saveDay();
}

function overview() {
  var m = 0, l = 0;
  for (var k in states) {
    var s = states[k][0];
    if (s === 2) m += 1; else if (s === 1) l += 1;
  }
  return { mastered: m, learning: l, touched: m + l, total: TOTAL };
}
function tierStat(code) {
  var m = 0, l = 0, n = 0, unitIds = [];
  UNITS.forEach(function (u) {
    if (u.k !== code) return;
    unitIds.push(u.i);
    u.w.forEach(function (i) {
      n += 1;
      var st = states[i];
      if (!st) return;
      if (st[0] === 2) m += 1; else if (st[0] === 1) l += 1;
    });
  });
  return { mastered: m, learning: l, done: m + l, total: n, units: unitIds };
}
function unitStat(uid) {
  var u = null;
  for (var k = 0; k < UNITS.length; k++) if (UNITS[k].i === uid) u = UNITS[k];
  if (!u) return { mastered: 0, learning: 0, total: 0, done: 0 };
  var m = 0, l = 0;
  u.w.forEach(function (i) {
    var st = states[i];
    if (!st) return;
    if (st[0] === 2) m += 1; else if (st[0] === 1) l += 1;
  });
  return { mastered: m, learning: l, total: u.w.length, done: m + l };
}
function dueList() {
  var t = todayInt(), out = [];
  for (var k in states) {
    var st = states[k];
    if (isDue(st, t)) out.push({ i: +k, st: st, score: (t - st[2]) * 10 + (st[4] || 0) * 2 });
  }
  out.sort(function (a, b) { return b.score - a.score; });
  return out;
}
function todayNewQueue() {
  var t = todayInt();
  var doneToday = (dayMap[String(t)] && dayMap[String(t)][0]) || 0;
  var need = Math.max(0, settings.dailyNew - doneToday);
  var out = [];
  for (var u = 0; u < UNITS.length && out.length < need; u++) {
    var ws = UNITS[u].w;
    for (var j = 0; j < ws.length && out.length < need; j++) {
      if (!states[ws[j]]) out.push(ws[j]);
    }
  }
  return out;
}
function nextUnitOfTier(code) {
  for (var u = 0; u < UNITS.length; u++) {
    if (UNITS[u].k !== code) continue;
    var st = unitStat(UNITS[u].i);
    if (st.done < st.total) return UNITS[u].i;
  }
  return null;
}
function streak() {
  var t = todayInt(), n = 0;
  while (dayMap[String(t - n)] && (dayMap[String(t - n)][0] + dayMap[String(t - n)][1]) > 0) n += 1;
  return n;
}

/* ============================================================
   发音（有道 TTS，浏览器直接可用）
   ============================================================ */
var audio = null;
function speakLocal(word) {
  if (!window.speechSynthesis) return false;
  try {
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(word);
    u.lang = 'en-US';
    u.rate = 0.9;
    speechSynthesis.speak(u);
    return true;
  } catch (e) {
    return false;
  }
}
function speak(word) {
  /* 断网优先：用设备自带语音，不依赖网络 */
  if (navigator.onLine === false && speakLocal(word)) return;
  try {
    if (!audio) audio = new Audio();
    audio.src = 'https://dict.youdao.com/dictvoice?audio=' + encodeURIComponent(word) + '&type=2';
    audio.play().catch(function () {
      if (!speakLocal(word)) toast('发音加载失败，检查网络');
    });
  } catch (e) {
    if (!speakLocal(word)) toast('当前浏览器不支持播放');
  }
}
function toast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('on');
  setTimeout(function () { el.classList.remove('on'); }, 1600);
}

/* ============================================================
   渲染框架
   ============================================================ */
var stage = document.getElementById('stage');
var pageTitle = document.getElementById('pageTitle');
var pageTag = document.getElementById('pageTag');
var current = 'today';
var session = null;

function nav(page) {
  current = page;
  if (page !== 'study') session = null;
  document.querySelectorAll('.tabbar button').forEach(function (b) {
    b.classList.toggle('on', b.dataset.nav === (page === 'study' ? (session && session.back || 'today') : page));
  });
  render();
}
document.querySelectorAll('.tabbar button').forEach(function (b) {
  b.addEventListener('click', function () { nav(b.dataset.nav); });
});

function render() {
  if (current === 'today') renderToday();
  else if (current === 'library') renderLibrary();
  else if (current === 'stats') renderStats();
  else if (current === 'settings') renderSettings();
  else if (current === 'study') renderStudy();
}

/* ---------------- 今日 ---------------- */
function renderToday() {
  pageTitle.textContent = '今日';
  pageTag.textContent = '本地存储 · 不联网';
  var ov = overview();
  var due = dueList().length;
  var newQ = todayNewQueue().length;
  var percent = TOTAL ? Math.round((ov.mastered / TOTAL) * 100) : 0;
  var dash = 2 * Math.PI * 45;

  var html = '<div class="card"><div class="ringwrap">' +
    '<div class="ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="none" stroke="#e6ece7" stroke-width="7"></circle>' +
    '<circle cx="50" cy="50" r="45" fill="none" stroke="#1a7f63" stroke-width="7" stroke-linecap="round" stroke-dasharray="' + (dash * percent / 100).toFixed(1) + ' ' + dash.toFixed(1) + '" transform="rotate(-90 50 50)"></circle></svg>' +
    '<div class="val"><b>' + percent + '%</b><span>已掌握</span></div></div>' +
    '<div style="flex:1"><div style="font-size:13px">已掌握 <b>' + ov.mastered + '</b> / 共 ' + TOTAL + ' 词</div>' +
    '<div class="kv"><div class="box"><b>' + ov.learning + '</b><span>学习中</span></div>' +
    '<div class="box"><b>' + (TOTAL - ov.touched) + '</b><span>未开始</span></div></div></div></div>' +
    '<div class="section-title">今天</div>' +
    '<button class="btn" id="btnNew" ' + (newQ ? '' : 'disabled') + '>今日新词 ' + newQ + ' 个</button>' +
    '<button class="btn ghost" id="btnRev" ' + (due ? '' : 'disabled') + '>待复习 ' + due + ' 个</button>' +
    '</div>' +
    '<div class="card"><div class="section-title" style="margin-top:0">按真题价值分级（点某一级从下一组开始）</div>';

  TIERS.forEach(function (t) {
    var st = tierStat(t.k);
    var p = st.total ? Math.round(st.done / st.total * 100) : 0;
    var pct = st.total ? (st.done / st.total * 100) : 0;
    html += '<div class="tier" data-tier="' + t.k + '">' +
      '<div class="badge">' + t.k + '</div>' +
      '<div class="m"><b>' + t.n + '</b><span>' + t.d + '</span>' +
      '<div class="bar"><i style="width:' + pct.toFixed(1) + '%"></i></div></div>' +
      '<div class="p">' + st.done + '/' + st.total + '<br>' + p + '%</div></div>';
  });
  html += '</div>';
  stage.innerHTML = html;

  var bNew = document.getElementById('btnNew');
  if (bNew) bNew.addEventListener('click', function () { startSession('new'); });
  var bRev = document.getElementById('btnRev');
  if (bRev) bRev.addEventListener('click', function () { startSession('review'); });
  stage.querySelectorAll('.tier').forEach(function (el) {
    el.addEventListener('click', function () {
      var uid = nextUnitOfTier(el.dataset.tier);
      if (!uid) { toast('这一级已经背完了'); return; }
      startSession('unit', { unit: uid });
    });
  });
}

/* ---------------- 学习会话 ---------------- */
function startSession(mode, opt) {
  opt = opt || {};
  var queue = [];
  var title = '';
  if (mode === 'new') { queue = todayNewQueue(); title = '今日新词'; }
  else if (mode === 'review') {
    queue = dueList().map(function (x) { return x.i; });
    title = '复习';
  } else if (mode === 'unit') {
    var u = UNITS.filter(function (x) { return x.i === opt.unit; })[0];
    queue = u ? u.w.slice() : [];
    title = u ? u.t : '分组';
  } else if (mode === 'topic') {
    queue = [];
    WORDS.forEach(function (a, i) { if (a[2] === opt.topic) queue.push(i); });
    title = '主题：' + ((TOPICS[opt.topic] || ['其他'])[0]);
  } else if (mode === 'word') {
    queue = [opt.word];
    title = '单词详情';
  }
  session = { mode: mode, queue: queue, idx: 0, revealed: false, counts: { known: 0, fuzzy: 0, unknown: 0 }, title: title, back: mode === 'word' ? 'library' : 'today', results: [], opts: opt };
  current = 'study';
  renderStudy();
}

function curWord() {
  if (!session || session.idx >= session.queue.length) return null;
  return wordObj(session.queue[session.idx]);
}

function renderStudy() {
  if (!session) { nav('today'); return; }
  pageTitle.textContent = session.title;
  pageTag.textContent = session.queue.length + ' 个词';

  if (!session.queue.length) {
    stage.innerHTML = '<div class="card donecard"><b>这里暂无词</div><div class="tiny">' +
      (session.mode === 'review' ? '今天没有到期的复习，去背新词吧。' : session.mode === 'new' ? '今日新词已完成，或今天目标已达成。' : '没有可学的词。') +
      '</div><button class="btn" id="back">返回今日</button></div>';
    document.getElementById('back').addEventListener('click', function () { nav('today'); });
    return;
  }

  if (session.idx >= session.queue.length) {
    var c = session.counts, sum = c.known + c.fuzzy + c.unknown;
    stage.innerHTML = '<div class="card donecard"><b>这一组背完了</b><div class="tiny">共 ' + sum + ' 个词</div>' +
      '<div class="nums"><div><b style="color:#1a7f63">' + c.known + '</b><div class="tiny">认识</div></div>' +
      '<div><b style="color:#d98026">' + c.fuzzy + '</b><div class="tiny">模糊</div></div>' +
      '<div><b style="color:#c0392b">' + c.unknown + '</b><div class="tiny">不认识</div></div></div>' +
      '<button class="btn" id="again">再背一遍</button><button class="btn ghost" id="back">返回今日</button></div>';
    document.getElementById('again').addEventListener('click', function () { startSession(session.mode, session.opts); });
    document.getElementById('back').addEventListener('click', function () { nav('today'); });
    return;
  }

  var w = curWord();
  var done = session.idx;
  var pct = (done / session.queue.length * 100).toFixed(1);

  var html = '<div class="study-top"><span class="pill">' + (done + 1) + ' / ' + session.queue.length + '</span>' +
    '<div style="flex:1"><div class="prog"><i style="width:' + pct + '%"></i></div></div>' +
    '<span class="pill" style="cursor:pointer" id="quit">退出</span></div>' +
    '<div class="wordcard">' +
    '<div class="w">' + w.w + '</div>' +
    '<div class="speaker" id="spk">🔊 朗读</div>';

  if (session.revealed) {
    html += '<div class="m">' + w.m + '</div>' +
      '<div class="meta">' + (w.tier ? '[' + w.tier + ' 级 · ' + w.tierName + ']' : '') + (w.k ? ' 真题出现 ' + w.k + ' 次' : '') + (w.tn ? ' · ' + w.tn : '') + '</div>';
    if (settings.showExample && w.ex) {
      html += '<div class="ex">' + w.ex + (w.exT ? '<em>' + w.exT + '</em>' : '') + (w.exS ? '<em>来源：' + w.exS + '</em>' : '') + '</div>';
    }
  } else {
    html += '<div class="tiny" style="margin-top:22px">先回想它的意思，再点下面的按钮</div>';
  }
  html += '</div>';

  if (!session.revealed) {
    html += '<div class="fb"><button class="u" id="fU">不认识</button><button class="f" id="fF">模糊</button><button class="k" id="fK">认识</button></div>' +
      '<button class="btn ghost" id="reveal" style="margin-top:10px">显示释义</button>';
  } else {
    html += '<button class="btn" id="next">下一个</button>';
  }
  stage.innerHTML = html;

  document.getElementById('spk').addEventListener('click', function () { speak(w.w); });
  if (settings.autoSpeak) speak(w.w);
  document.getElementById('quit').addEventListener('click', function () { nav('today'); });
  if (!session.revealed) {
    document.getElementById('fU').addEventListener('click', function () { answer('unknown'); });
    document.getElementById('fF').addEventListener('click', function () { answer('fuzzy'); });
    document.getElementById('fK').addEventListener('click', function () { answer('known'); });
    document.getElementById('reveal').addEventListener('click', function () { session.revealed = true; renderStudy(); });
  } else {
    document.getElementById('next').addEventListener('click', function () { advance(); });
  }
}

function answer(fb) {
  var w = curWord();
  if (!w) return;
  var t = todayInt();
  var prev = getState(w.i);
  setState(w.i, applyState(prev, fb, t));
  touchDay(prev && prev[0] !== 0 ? 'rev' : 'new');
  session.counts[fb] += 1;
  session.lastFb = fb;
  if (fb === 'known') advance();
  else { session.revealed = true; renderStudy(); }
}

function advance() {
  session.idx += 1;
  session.revealed = false;
  renderStudy();
}

/* ---------------- 词库 ---------------- */
var libTab = 'tier';
function renderLibrary() {
  pageTitle.textContent = '词库';
  pageTag.textContent = TOTAL + ' 词 · ' + UNITS.length + ' 组 · ' + TOPICS.length + ' 主题';
  var html = '<div class="tabs">' +
    '<button data-tab="tier" class="' + (libTab === 'tier' ? 'on' : '') + '">按分级</button>' +
    '<button data-tab="topic" class="' + (libTab === 'topic' ? 'on' : '') + '">按主题</button>' +
    '<button data-tab="search" class="' + (libTab === 'search' ? 'on' : '') + '">搜词</button></div>';

  if (libTab === 'tier') {
    TIERS.forEach(function (t) {
      var st = tierStat(t.k);
      html += '<div class="card"><div style="display:flex;justify-content:space-between;align-items:baseline">' +
        '<b style="font-size:15px">' + t.k + ' 级 · ' + t.n + '</b><span class="tiny">' + st.done + '/' + st.total + '</span></div>' +
        '<div class="tiny" style="margin:4px 0 10px">' + t.d + '</div><div class="chips">';
      UNITS.forEach(function (u) {
        if (u.k !== t.k) return;
        var us = unitStat(u.i);
        var cls = us.done >= us.total ? 'full' : (us.done > 0 ? 'part' : '');
        html += '<div class="chip ' + cls + '" data-unit="' + u.i + '">' + u.g + '</div>';
      });
      html += '</div></div>';
    });
  } else if (libTab === 'topic') {
    html += '<div class="card">';
    TOPICS.forEach(function (tp, idx) {
      var n = tp[1], done = 0;
      WORDS.forEach(function (a, i) { if (a[2] === idx && states[i]) done += 1; });
      html += '<div class="row" data-topic="' + idx + '"><div class="l">' + tp[0] + '</div><div class="r">' + done + '/' + n + ' →</div></div>';
    });
    html += '</div>';
  } else {
    html += '<div class="searchbox"><input id="q" placeholder="输入英文或中文，如 economic / 经济"><button class="btn" style="width:88px;margin:0;padding:11px 0;font-size:14px" id="go">搜索</button></div><div id="out"></div>';
  }
  stage.innerHTML = html;

  stage.querySelectorAll('[data-tab]').forEach(function (b) {
    b.addEventListener('click', function () { libTab = b.dataset.tab; renderLibrary(); });
  });
  stage.querySelectorAll('[data-unit]').forEach(function (c) {
    c.addEventListener('click', function () { startSession('unit', { unit: +c.dataset.unit }); });
  });
  stage.querySelectorAll('[data-topic]').forEach(function (r) {
    r.addEventListener('click', function () { startSession('topic', { topic: +r.dataset.topic }); });
  });
  if (libTab === 'search') {
    var q = document.getElementById('q');
    var go = function () {
      var kw = q.value.trim().toLowerCase();
      var out = document.getElementById('out');
      if (!kw) { out.innerHTML = ''; return; }
      var res = [];
      for (var i = 0; i < WORDS.length && res.length < 60; i++) {
        var a = WORDS[i];
        if (a[0].toLowerCase().indexOf(kw) >= 0 || (a[1] && a[1].indexOf(kw) >= 0)) res.push(i);
      }
      if (!res.length) { out.innerHTML = '<div class="card"><div class="tiny">没有匹配 "' + q.value.trim() + '" 的词</div></div>'; return; }
      out.innerHTML = '<div class="tiny" style="margin:4px 0 8px">命中 ' + res.length + ' 个</div>' + res.map(function (i) {
        var w = wordObj(i);
        return '<div class="res" data-word="' + i + '"><b>' + w.w + '</b> <span class="tiny">' + (w.tier || '') + '</span><p>' + w.m + '</p></div>';
      }).join('');
      out.querySelectorAll('[data-word]').forEach(function (el) {
        el.addEventListener('click', function () { startSession('word', { word: +el.dataset.word }); });
      });
    };
    document.getElementById('go').addEventListener('click', go);
    q.addEventListener('keydown', function (e) { if (e.key === 'Enter') go(); });
    q.focus();
  }
}

/* ---------------- 统计 ---------------- */
function renderStats() {
  pageTitle.textContent = '统计';
  pageTag.textContent = '连续打卡 ' + streak() + ' 天';
  var ov = overview();
  var t = todayInt();
  var td = dayMap[String(t)] || [0, 0];
  html = '<div class="card"><div class="kv" style="margin-top:0">' +
    '<div class="box"><b>' + ov.mastered + '</b><span>已掌握</span></div>' +
    '<div class="box"><b>' + ov.learning + '</b><span>学习中</span></div>' +
    '<div class="box"><b>' + (TOTAL - ov.touched) + '</b><span>未开始</span></div></div>' +
    '<div class="kv"><div class="box"><b>' + td[0] + '</b><span>今日新学</span></div>' +
    '<div class="box" style="cursor:pointer" id="toRev"><b>' + dueList().length + '</b><span>待复习 →</span></div>' +
    '<div class="box"><b>' + streak() + '</b><span>连续天数</span></div></div></div>';

  var days = recentDays(7);
  var max = 1;
  days.forEach(function (d) { var v = dayMap[String(d.int)] || [0, 0]; max = Math.max(max, v[0] + v[1]); });
  html += '<div class="card"><div class="section-title" style="margin-top:0">最近 7 天</div><div class="chart">';
  days.forEach(function (d) {
    var v = dayMap[String(d.int)] || [0, 0];
    var hn = (v[0] / max * 90) + 'px', hr = (v[1] / max * 90) + 'px';
    html += '<div class="col"><div class="stack">' +
      '<div class="rev" style="height:' + hr + '"></div>' +
      '<div class="new" style="height:' + hn + '"></div></div><span>' + d.label + '</span></div>';
  });
  html += '</div><div class="legend"><span><i style="background:#1a7f63"></i>新学</span><span><i style="background:#d98026"></i>复习</span></div></div>';

  html += '<div class="card"><div class="section-title" style="margin-top:0">分级进度</div>';
  TIERS.forEach(function (tt) {
    var st = tierStat(tt.k);
    html += '<div class="tier"><div class="badge">' + tt.k + '</div><div class="m"><b>' + tt.n + '</b>' +
      '<div class="bar"><i style="width:' + (st.total ? (st.done / st.total * 100) : 0) + '%"></i></div></div>' +
      '<div class="p">' + st.done + '/' + st.total + '</div></div>';
  });
  html += '</div>';
  stage.innerHTML = html;
  var toRev = document.getElementById('toRev');
  if (toRev) toRev.addEventListener('click', function () { startSession('review'); });
}

/* ---------------- 设置 ---------------- */
function renderSettings() {
  pageTitle.textContent = '设置';
  pageTag.textContent = '全部存在本机';
  var html = '<div class="card"><div class="section-title" style="margin-top:0">每日新词</div><div class="seg" id="daily">' +
    [10, 20, 30, 50].map(function (n) { return '<button data-v="' + n + '" class="' + (settings.dailyNew === n ? 'on' : '') + '">' + n + '</button>'; }).join('') +
    '</div><div class="tiny" style="margin-top:8px">按每天 20 个算，' + TOTAL + ' 词约 9 个月过完一轮。</div></div>' +

    '<div class="card"><div class="row"><div class="l">自动朗读</div><div class="r"><button class="btn ghost" style="margin:0;padding:8px 14px;font-size:13px" id="swSpeak">' + (settings.autoSpeak ? '已开启' : '已关闭') + '</button></div></div>' +
    '<div class="row"><div class="l">显示例句</div><div class="r"><button class="btn ghost" style="margin:0;padding:8px 14px;font-size:13px" id="swEx">' + (settings.showExample ? '已开启' : '已关闭') + '</button></div></div></div>' +

    '<div class="card"><div class="row"><div class="l">词库</div><div class="r">' + TOTAL + ' 词 / ' + UNITS.length + ' 组</div></div>' +
    '<div class="row"><div class="l">数据来源</div><div class="r">NETEMVocabulary</div></div>' +
    '<div class="row"><div class="l">许可</div><div class="r">CC BY-NC-SA 4.0</div></div>' +
    '<div class="row"><div class="l">离线</div><div class="r" id="offState">检测中…</div></div>' +
    '<div class="row"><div class="l">安装到桌面</div><div class="r" style="font-size:12px;text-align:right;max-width:60%">手机浏览器菜单里选「添加到主屏幕」</div></div></div>' +

    '<div class="card"><button class="btn ghost" id="reset" style="color:#c0392b;background:#fdecea">清空全部背词记录</button></div>';
  stage.innerHTML = html;

  stage.querySelectorAll('#daily button').forEach(function (b) {
    b.addEventListener('click', function () { settings.dailyNew = +b.dataset.v; saveSettings(); renderSettings(); });
  });
  document.getElementById('swSpeak').addEventListener('click', function () { settings.autoSpeak = !settings.autoSpeak; saveSettings(); renderSettings(); });
  document.getElementById('swEx').addEventListener('click', function () { settings.showExample = !settings.showExample; saveSettings(); renderSettings(); });
  document.getElementById('reset').addEventListener('click', function () {
    if (!confirm('会清空全部背词进度，确定吗？')) return;
    states = {}; dayMap = {}; saveStates(); saveDay();
    toast('已清空');
    nav('today');
  });
}

/* ---------------- 启动 ---------------- */
render();

/* 支持用 URL 参数直达某个界面，便于截图与自测：
   index.html?page=study&mode=unit&unit=1
   index.html?page=library&tab=topic
   index.html?page=stats
   index.html?page=settings                                       */
(function () {
  var qs = new URLSearchParams(location.search);
  var p = qs.get('page');
  if (!p) return;
  if (p === 'study') {
    var mode = qs.get('mode') || 'unit';
    startSession(mode, {
      unit: Number(qs.get('unit')) || 1,
      topic: Number(qs.get('topic')) || 0,
      word: Number(qs.get('word')) || 0
    });
  } else if (p === 'library') {
    libTab = qs.get('tab') || 'tier';
    nav('library');
  } else {
    nav(p);
  }
})();
</script>
<script>
/* ---------------- 离线状态显示 ---------------------------- */
function fillOfflineState() {
  var el = document.getElementById('offState');
  if (!el) return;
  var text;
  if (location.protocol === 'file:') {
    text = '单文件离线可用';
  } else if (navigator.serviceWorker && navigator.serviceWorker.controller) {
    text = navigator.onLine === false ? '离线运行中' : '已缓存，可断网';
  } else {
    text = '未启用（需 https 或 localhost）';
  }
  el.textContent = text;
}

/* 注册 Service Worker（file:// 打开时浏览器不允许，自动跳过） */
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('sw.js').then(function () {
    setTimeout(fillOfflineState, 800);
  }).catch(function (e) {
    console.warn('SW 注册失败：', e);
  });
  navigator.serviceWorker.addEventListener('controllerchange', fillOfflineState);
}

window.addEventListener('online', fillOfflineState);
window.addEventListener('offline', fillOfflineState);
(function () {
  var _rs = renderSettings;
  renderSettings = function () { _rs(); fillOfflineState(); };
  fillOfflineState();
})();
</script>
